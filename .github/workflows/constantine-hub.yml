name: Constantine Hub

on:
  push:
    branches: [main]
    paths:
      - 'apps/ConstantineHub/**'
      - 'tests/ConstantineHub.LayoutTests/**'
      - 'adapters/godot-mcp/**'
      - '.github/workflows/constantine-hub.yml'
  pull_request:
    paths:
      - 'apps/ConstantineHub/**'
      - 'tests/ConstantineHub.LayoutTests/**'
      - 'adapters/godot-mcp/**'
      - '.github/workflows/constantine-hub.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore apps/ConstantineHub/ConstantineHub.csproj

      - name: Build
        run: dotnet build apps/ConstantineHub/ConstantineHub.csproj -c Release --no-restore

      - name: Verify font and DPI layout
        run: dotnet run --project tests/ConstantineHub.LayoutTests -c Release -- artifacts/layout

      - name: Verify native monitor layout
        run: dotnet run --project tests/ConstantineHub.LayoutTests -c Release -- artifacts/layout --native

      - name: Upload layout evidence
        uses: actions/upload-artifact@v4
        with:
          name: ConstantineHub-layout-evidence
          path: artifacts/layout
          if-no-files-found: error

      - name: Publish portable win-x64
        run: dotnet publish apps/ConstantineHub/ConstantineHub.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o artifacts/ConstantineHub-win-x64

      - name: Verify bundled Godot adapter
        shell: pwsh
        run: |
          $root = 'artifacts/ConstantineHub-win-x64/adapters/godot-mcp'
          if (-not (Test-Path "$root/run_godot_mcp.cmd")) { throw 'Godot MCP launcher was not bundled.' }
          if (-not (Test-Path "$root/project-addon/addons/constantine_mcp/plugin.cfg")) { throw 'Godot addon was not bundled.' }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConstantineHub-win-x64
          path: artifacts/ConstantineHub-win-x64
          if-no-files-found: error
