[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "constantine-local-files-mcp"
version = "0.1.0"
description = "Allowlist-scoped local filesystem MCP server for Constantine Hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
]

[project.scripts]
constantine-local-files-mcp = "local_files_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_files_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
