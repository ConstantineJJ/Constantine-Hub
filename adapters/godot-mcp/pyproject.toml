[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "constantine-godot-mcp"
version = "0.1.0"
description = "Godot editor/runtime MCP bridge managed by Constantine Hub"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2.0"]

[project.scripts]
constantine-godot-mcp = "godot_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_mcp"]
