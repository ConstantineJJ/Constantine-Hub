name: Constantine Hub

on:
  push:
    branches: [main]
    paths:
      - 'apps/ConstantineHub/**'
      - '.github/workflows/constantine-hub.yml'
  pull_request:
    paths:
      - 'apps/ConstantineHub/**'
      - '.github/workflows/constantine-hub.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore apps/ConstantineHub/ConstantineHub.csproj

      - name: Build
        run: dotnet build apps/ConstantineHub/ConstantineHub.csproj -c Release --no-restore

      - name: Publish portable win-x64
        run: dotnet publish apps/ConstantineHub/ConstantineHub.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o artifacts/ConstantineHub-win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConstantineHub-win-x64
          path: artifacts/ConstantineHub-win-x64
          if-no-files-found: error
